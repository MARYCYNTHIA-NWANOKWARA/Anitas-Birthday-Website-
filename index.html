<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Montserrat:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;height:100vh;height:100dvh;width:100vw}
#canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;transition:opacity 0.8s ease}
#stage{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.count{color:#fff;font-size:clamp(32px,18vw,120px);font-weight:300;letter-spacing:clamp(4px,1.5vw,10px);line-height:1.1;text-shadow:0 0 30px rgba(255,255,255,0.5);transition:opacity 0.5s ease,transform 0.5s ease;max-width:95vw}
.sub{color:#ffb6d9;font-size:clamp(20px,5vw,44px);font-style:italic;letter-spacing:2px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity 0.6s ease}
.sub.show{opacity:1}
#girlWrap{display:none;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px);width:100%;max-width:90vw;opacity:0}
#girlWrap.show{display:flex;opacity:1;animation:up 1s ease forwards}
#girlWrap img{width:clamp(160px,50vw,340px);max-height:50vh;object-fit:contain;filter:drop-shadow(0 0 25px rgba(255,182,217,0.35));animation:float 3s ease-in-out infinite}
#more{color:#e8d5d5;font-size:clamp(13px,3.6vw,19px);font-style:italic}
.btn{margin-top:6px;padding:clamp(10px,2.5vw,14px) clamp(28px,8vw,42px);border:1.5px solid #ffb6d9;background:rgba(255,182,217,0.08);backdrop-filter:blur(10px);color:#ffb6d9;font-family:Montserrat,sans-serif;font-size:clamp(11px,2.8vw,13.5px);letter-spacing:3.5px;text-transform:uppercase;border-radius:40px;text-decoration:none;animation:pulse 2s infinite;transition:.3s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,182,217,0.4)}70%{box-shadow:0 0 0 14px rgba(255,182,217,0)}100%{box-shadow:0 0 0 0 rgba(255,182,217,0)}}
@media(max-height:600px){#girlWrap img{max-height:38vh}}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="stage">
  <div id="main" class="count"></div>
  <div id="forYou" class="sub">For you.</div>
  <div id="girlWrap">
    <img src="girl.png" alt="girl">
    <div id="more">There's more waiting for you.</div>
    <a class="btn" href="giftcards.html">CLICK ME</a>
  </div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),main=document.getElementById('main'),forYou=document.getElementById('forYou'),girlWrap=document.getElementById('girlWrap');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
let particles=[],phase=0,hideParticles=false;
for(let i=0;i<500;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*2.8+0.4,color:Math.random()>0.5?'#ff8fab':'#ffffff',vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5});
function heartPos(t,s,cx,cy){let x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));return{x:cx+x*s,y:cy+y*s}}
particles.forEach((p,i)=>{let t=(i/particles.length)*Math.PI*2,sc=Math.min(canvas.width,canvas.height)*0.025,hp=heartPos(t,sc,canvas.width/2,canvas.height/2+10);p.hx=hp.x;p.hy=hp.y;});
let c=3;
function loop(){
  if(c>=1){
    main.textContent=c;
    main.style.opacity=1;main.style.transform='scale(1)';
    setTimeout(()=>{main.style.opacity=0;main.style.transform='scale(1.3)';setTimeout(()=>{c--;loop()},400)},850);
  } else {
    // 1. HAPPY - show then clear
    main.textContent='HAPPY';
    main.style.opacity=1;main.style.transform='scale(1)';
    setTimeout(()=>{
      main.style.opacity=0;
      setTimeout(()=>{
        // 2. BIRTHDAY - show then clear
        main.textContent='BIRTHDAY';
        main.style.opacity=1;main.style.transform='scale(1)';
        setTimeout(()=>{
          main.style.opacity=0;
          setTimeout(()=>{
            // 3. HEART + For you
            phase=2;
            forYou.classList.add('show');
            setTimeout(()=>{
              // 4. CLEAR EVERYTHING - heart + For you
              forYou.style.opacity=0;
              hideParticles=true;
              canvas.style.opacity=0;
              setTimeout(()=>{
                // 5. SHOW GIRL
                main.style.display='none';
                forYou.style.display='none';
                girlWrap.classList.add('show');
              },800);
            },3000);
          },400);
        },1400);
      },400);
    },500);
  }
}
loop();
function anim(){
  if(hideParticles) {ctx.clearRect(0,0,canvas.width,canvas.height); return;}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    if(phase<=1){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>canvas.width)p.vx*=-1;if(p.y<0||p.y>canvas.height)p.vy*=-1;}
    else if(phase==2){p.x+=(p.hx-p.x)*0.07;p.y+=(p.hy-p.y)*0.07;}
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();
  });
  requestAnimationFrame(anim);
}
anim();
</script>
</body>
