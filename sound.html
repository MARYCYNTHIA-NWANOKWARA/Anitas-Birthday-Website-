<!DOCTYPE html>

<title>SOUND - For You</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Cormorant Garamond',serif;padding:24px;display:flex;flex-direction:column;align-items:center}
a{text-decoration:none !important}
.back{align-self:flex-start;color:#ffb6d9;font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;border:1px solid #ffb6d9;padding:10px 18px;border-radius:30px;margin-bottom:24px}
h1{color:#ffb6d9;font-weight:300;font-size:clamp(28px,8vw,42px);letter-spacing:2px;margin-bottom:6px}
.sub{color:#e8d5d5;font-style:italic;font-size:16px;margin-bottom:28px;opacity:.8}
.player{width:100%;max-width:500px;background:#111;border:1px solid #222;border-radius:14px;padding:20px;margin-bottom:14px}
.player .label{font-family:Montserrat,sans-serif;font-size:10px;letter-spacing:3px;color:#ffb6d9;margin-bottom:12px}
audio{width:100%;filter:invert(1) hue-rotate(180deg) brightness(1.1)}
.song{display:flex;align-items:center;gap:12px;background:#151515;border:1px solid #222;border-radius:10px;padding:12px;margin-bottom:10px}
.song .cover{width:48px;height:48px;background:#ffb6d9;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#000;font-size:20px}
.song .info h4{font-size:15px;font-weight:400} .song .info p{font-size:12px;color:#aaa;font-style:italic}
.spotify{width:100%;max-width:500px;margin-top:20px;border-radius:12px;overflow:hidden;border:1px solid #222}
</style>
</head>
